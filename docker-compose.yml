version: '3.4'

services:
  db:
    image: mysql:8.0.26
    restart: always
    environment: 
      MYSQL_DATABASE: churchrecords_db
      MYSQL_USER: churchrecords_user
      MYSQL_PASSWORD: 3Myosae*sql
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - .dbdata:/var/lib/mysql
    ports:
      - 4404:3306


  web:
    build:
      context: .
      dockerfile: ./Dockerfile
    command: >
      sh -c "python manage.py makemigrations && 
            python manage.py migrate && 
            python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/BibleWay-BaptistChurch
    ports:
      - "8000:8000"