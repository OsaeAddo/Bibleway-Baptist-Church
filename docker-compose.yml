version: '3.9'

services:
  db:
    image: mysql:8.0.26
    restart: always
    environment: 
      MYSQL_DATABASE: churchrecords_db
      MYSQL_USER: churchrecords_user
      MYSQL_PASSWORD: 3Myosae*sql
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - .dbdata:/var/lib/mysql
    ports:
      - 4404:3306


  web:
    build:
      context: .
      dockerfile: ./Dockerfile
    command: >
      sh -c "python manage.py makemigrations && 
            python manage.py migrate && 
            python manage.py runserver 0.0.0.0:8001"
    volumes:
      - .:/BibleWay-BaptistChurch
    expose:
      - 8001
    depends_on:
      - db
    # restart: on-failure
    

volumes:
  mysql:
  mysql_config: