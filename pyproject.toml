[tool.poetry]
name = "bibleway-baptist-church"
version = "0.1.0"
description = "Web app for bibleway-baptist-church"
authors = ["OsaeAddo <immanueloaddo@gmail.com>"]

[tool.poetry.dependencies]
Django = "^4.0.3"
dj-database-url = "^0.5.0"
whitenoise = {extras = ["brotli"], version = "^6.0.0"}


python = "^3.8"
gunicorn = "20.1.0"
psycopg2-binary = "2.9.1"
