{% load static %}
{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/tailwind/tailwind.css' %}">
    <link rel="stylesheet" href="{% static 'records_management/leader_login.css' %}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@200&display=swap" rel="stylesheet">

    <title>Login | Bible Way Baptist Church</title>
</head>
<body>
    <nav class="mb-4" style="background: linear-gradient(to right,rgb(29, 95, 29), rgb(26, 24, 46));">
        <div class="flex justify-between p-2">
            <a href="/"><img class="rounded-full w-12 p-0.5" src="{% static 'images/logo2.png' %}"
                    alt="Logo | Bible Way Baptist Church"></a>
            <ul class="justify-self-end flex space-x-4 justify-center items-center text-gray-50 font-semibold pr-4">
                <li class=""><a href="{% url 'home-page' %}">Home</a></li>
                <li class=""><a href="{% url 'home-page' %}">Location</a></li>
                <li class=""><a href="{% url 'home-page' %}">Worship</a></li>
                <li class=""><a href="{% url 'home-page' %}">About</a></li>
            </ul>
        </div>
    </nav>
    <main>
        <div class="flex flex-col items-center justify-center p-4">
            <span class="text-gray-800 uppercase m-4">Church leader login</span>
            <form
                class="flex flex-col items-center justify-center bg-gray-300 py-8 px-4 rounded-xl text-gray-900 sm:w-full md:w-2/5 h-1/2 shadow-lg"
                action="." method="post">
                {% csrf_token %}
                <div class="p-4">
                    {{form.username|as_crispy_field}}
                </div>
                <div class="p-4">
                    {{form.password|as_crispy_field}}
                </div>

                <div class="mt-4 mb-1 text-gray-50">
                    <button class="w-20 bg-gray-700 rounded-full px-2 py-1" type="submit">Submit</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
