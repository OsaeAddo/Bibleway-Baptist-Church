{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block styles %}{% endblock styles %}
    <title>SignUp</title>
</head>
<body>
    {% block signup %}{% endblock signup %}
    <script>0</script>
    <div class="login-box" style="background: linear-gradient(#e66465, #9198e5);">
        <h2>
        {% block signuptype %}{% endblock signuptype %}
        </h2>

        <form>
            <div class="user-box">
                
                <input type="text" name="" required="">
                <label>Username</label>
            </div>
            <div class="user-box">
                
                <input type="text" name="" required="">
                <label>Firstname</label>
            </div>
            <div class="user-box">
                
                <input type="text" name="" required="">
                <label>Lastname</label>
            </div>
            <div class="user-box">
                <input type="password" name="" required="True">
                <label>Password</label>
            </div>
            <div class="user-box">
                <input type="password" name="" required="True">
                <label>Confirm Password</label>
            </div>
            <a href="#">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                Sign Up
            </a>
        </form>
    </div>
</body>
</html>
