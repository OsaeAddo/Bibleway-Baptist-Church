<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard | New Way Baptist Church</title>

  <link rel="stylesheet" href="{% static 'records_management/admin_base_dashboard.css' %}">

</head>

<body>
  <div class="central-layout">
    <!-- nav section -->
    <nav class="admin-navbar">
      <div>
        <div class="navbar-logo">
          <a href="{% url 'churchadmin-dashboard' %}" class="navbar-logo">CHURCH MANAGEMENT</a>
        </div>
        <div class="navbar-logout">
          <a href="{% url 'logout' %}" class="">Logout</a>
        </div>
      </div>
    </nav>
    <!-- end nav-->

    <!-- Sidebar section-->
    <nav class="menu admin-sidebar" tabindex="0">
      <div class="smartphone-menu-trigger"></div>
      <header class="avatar">
        <img src="{% static "images/adminpropic.png" %}" />
        <br><br>
        <h6>Church Admin</h6>
        <h2>{{request.user.first_name}}</h2>
      </header>
      <ul>
        <li tabindex="0" class="icon-dashboard"> 
            <a style="color:white; text-decoration:none;" href="#">
                <span>Dashboard</span>
            </a> 
        </li>
        <li tabindex="0" class="icon-customers"> 
            <a style="color:white; text-decoration:none;" href="#"><span>Church Leader</span>
            </a>
        </li>
        <li tabindex="0" class="icon-users"> 
            <a style="color:white; text-decoration:none;" href="#">
              <span>Church Member</span>
            </a>
        </li>
      </ul>
    </nav>

    <main class="admin-main">
      <br><br>
    
    
      {% block content %}
    
      {% endblock content %}
    
    
    </main>
    <br><br><br><br>
    <footer class="admin-footer">
      <p>
        <a id="ftr" href="" class="fa fa-facebook"></a>
        <a id="ftr" href="" class="fa fa-whatsapp"></a>
        <a id="ftr" href="" class="fa fa-instagram"></a>
        <a id="ftr" href="" class="fa fa-twitter"></a>
      </p>
  
      <br>
      <div class="container">

            <div style="color:#ffffff;" class="footer-copyright">
                Copyright &copy; 2021 Bible Way Baptist Church</p>
            </div>
      </div>
    </footer>


  </div>

</body>

</html>
<!-- Built by Osae -->
