{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/5.0.0/normalize.min.css">
    <link rel="stylesheet" href="{% static 'records_management/admin_base_dashboard.css' %}">
    <title>Admin Dashboard</title>
</head>
<body>
    <div class="admin">
        <header class="admin_header">
            <a href="#" class="logo">
                <h1>Church Admin</h1>
            </a>
            <div class="toolbar">
                <button class="btn btn--primary">Add new user</button>
                <a href="#" class="logout">
                    Log Out
                </a>
            </div>
        </header>
        <nav class="admin_nav">
            <ul class="menu">
                <li class="menu__item">
                  <a class="menu__link" href="#">Dashboard</a>
                </li>
                <li class="menu__item">
                  <a class="menu__link" href="#">Sales</a>
                </li>
                <li class="menu__item">
                  <a class="menu__link" href="#">Campagins</a>
                </li>
                <li class="menu__item">
                  <a class="menu__link" href="#">Servers</a>
                </li>
                <li class="menu__item">
                  <a class="menu__link" href="#">Foobars</a>
                </li>
            </ul>
        </nav>
        <main class="admin_main">
            <h2>Dashboard</h2>
            <div class="dashboard">
                <div class="dashboard_item">
                    <div class="card">
                        <strong>41</strong> Foobars
                    </div>
                </div>
                <div class="dashboard_item">
                    <div class="card">
                        <strong>81.712</strong> Doohickeys
                    </div>
                </div>
                <div class="dashboard_item dashboard_item--full">
                    <div class="card">
                        <img src="https://imgs.xkcd.com/comics/decline.png" alt="" />
                    </div>
                </div>
                <div class="dashboard_item dashboard_item--col">
                    <div class="card">A</div>
                </div>
                <div class="dashboard_item dashboard_item--col">
                    <div class="card">B</div>
                </div>
                <div class="dashboard_item dashboard_item--col">
                    <div class="card">C</div>
                </div>
                <div class="dashboard_item dashboard_item--col">
                    <div class="card">D</div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
