{% extends "records_management/base_login.html" %}
{% load static %}

{% block loginform %}
  <form class="" method="post" action="{% url 'adminlogin' %}" enctype="multipart/form-data">
    {% csrf_token %}
      <h1 class="font-bold">Admin Log In</h1>
      <div class="md:w-1/2">{{form.username}}</div>
      <div class="md:w-1/2">{{form.password}}</div>
      <a class="text-gray-800 pb-1" href="#">Forgot your password?</a>
      <button type="submit">Log In</button>
  </form>
{% endblock loginform %}
