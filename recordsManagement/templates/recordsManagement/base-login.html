{% load static %}
<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="{% static 'favicon.ico' %}">
  <link rel="stylesheet" href="{% static 'css/tailwind/tailwind.css' %}">
  <link rel="stylesheet" href="{% static 'recordsManagement/navbar.css' %}">
  
  <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css'>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'recordsManagement/base-login.css' %}">
  <link rel="stylesheet" href="{% static 'recordsManagement/preloader.css' %}">
    
  <script src="{% static 'js/preloader.js' %}"></script>
  
  <script src="https://unpkg.com/scrollreveal@4.0.0/dist/scrollreveal.min.js"></script>
  
  {% block title %}{% endblock title %}
  
</head>
<body>
  <div id="loader"></div>
  <div id="content">
    <nav class="py-4 main-nav">
          {% include 'recordsManagement/navbar.html' %}
    </nav>
    
    {% block loginform %}{% endblock loginform %}
    {% block no-account-text %}{% endblock no-account-text %}
  </div>
	<script src="{% static 'js/active-link.js' %}"></script>
  <script src="{% static 'js/error-engine.js' %}"></script>
  <script src="{% static 'js/togglePassword.js' %}"></script>
</body>
</html>
